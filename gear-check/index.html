<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17324d">
  <title>浜名ヤンキース｜道具チェック</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="道具チェック">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <style>
    :root{--navy:#17324d;--navy2:#254968;--red:#d54c4c;--green:#13845d;--bg:#f4f6fa;--card:#fff;--ink:#1c2a38;--muted:#657285;--line:#e1e7ee;--light:#eaf1f6;--shadow:0 5px 24px rgba(23,50,77,.055)}
    *{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;font-size:15px}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #6c9fdb;outline-offset:2px}
    .shell{max-width:720px;margin:auto;padding:0 15px 90px}.hero{background:var(--navy);color:white;margin:0 -15px 18px;padding:22px 20px 24px;border-radius:0 0 23px 23px}.hero .eyebrow{font-size:11px;letter-spacing:.16em;opacity:.75;font-weight:700}.hero h1{font-size:25px;letter-spacing:.02em;margin:5px 0 4px}.hero p{font-size:12px;opacity:.86;margin:0}
    .box{background:var(--card);border-radius:17px;padding:17px;margin-bottom:14px;box-shadow:var(--shadow);border:1px solid var(--line)}.section-title{font-size:13px;color:var(--muted);font-weight:800;margin-bottom:10px}.mode-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.mode-tab{padding:13px 3px;border:1.5px solid var(--line);border-radius:11px;background:white;color:var(--navy);font-weight:750;font-size:13px;min-height:53px}.mode-tab.active{border-color:var(--navy);background:var(--navy);color:white;box-shadow:0 2px 5px #17324d28}
    .season-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.pill{border-radius:100px;background:#e7f2ee;color:#066044;padding:6px 11px;font-size:12px;font-weight:800}.muted{color:var(--muted)}.small{font-size:12px}.season-set{display:flex;gap:5px}.seg{background:#eef2f6;border:1px solid transparent;padding:9px 13px;border-radius:9px;color:var(--muted);font-weight:700;font-size:13px}.seg.active{background:#e1ecf8;color:var(--navy);border-color:#a9c4df}.subnote{font-size:12px;color:var(--muted);margin-top:9px;line-height:1.6}
    .navrow{display:flex;gap:7px;margin:0 0 15px}.navbtn{border:0;padding:11px 18px;background:transparent;border-radius:12px;color:var(--muted);font-weight:800}.navbtn.active{background:white;color:var(--navy);box-shadow:var(--shadow)}
    .progress-header{display:flex;justify-content:space-between;align-items:baseline;gap:12px}.progress-header h2{font-size:17px;margin:0 0 11px}.progress-header strong{color:var(--navy);font-size:22px;font-variant-numeric:tabular-nums}.track{height:10px;background:#e9edf3;border-radius:20px;overflow:hidden}.fill{height:100%;background:var(--green);border-radius:20px;transition:width .2s}.positive{background:#e7f7ef;border:1px solid #b9e5cc;border-radius:10px;padding:11px 12px;color:#176846;font-size:13px;font-weight:700;margin:12px 0 0}.info{background:#eef5fc;border:1px solid #cee2f4;border-radius:10px;padding:12px;color:#315b83;font-size:12px;line-height:1.7;margin-bottom:13px}.warning{background:#fff8e8;border-color:#f4deb1;color:#815d17}
    .store-head{display:flex;align-items:center;justify-content:space-between;margin:0 0 5px}.store-head h2{font-size:18px;margin:0;color:var(--navy)}.count{background:#eef2f7;border-radius:40px;padding:5px 10px;font-weight:800;font-size:12px;color:var(--navy);font-variant-numeric:tabular-nums}.gear-list{display:flex;flex-direction:column}.gear-item{display:flex;gap:13px;align-items:center;padding:13px 3px;border-bottom:1px solid var(--line);cursor:pointer;min-height:59px}.gear-item:last-child{border-bottom:0;padding-bottom:4px}.gear-check{appearance:none;-webkit-appearance:none;margin:0;width:27px;height:27px;flex-shrink:0;border:2px solid #aebccc;border-radius:8px;background:white;display:grid;place-items:center}.gear-check:checked{border-color:var(--green);background:var(--green)}.gear-check:checked::after{content:"";width:6px;height:12px;border:solid white;border-width:0 2.5px 2.5px 0;transform:translateY(-2px) rotate(45deg)}.gear-item.checked .gear-name{color:#6e7c8a;text-decoration:line-through}.gear-name{font-weight:750;font-size:15px}.gear-qty{font-weight:700;color:#537087;font-size:12px;background:#eff4f7;border-radius:6px;padding:4px 7px;margin-left:auto;white-space:nowrap}.empty{text-align:center;padding:26px 12px;color:var(--muted);font-size:13px;line-height:1.7}
    .btn{border:0;border-radius:11px;padding:13px 17px;font-weight:800;font-size:14px;min-height:45px}.btn.primary{background:var(--navy);color:white}.btn.light{background:#edf2f6;color:var(--navy)}.btn.danger{background:#fff0f0;color:#b83333}.btn:disabled{opacity:.5;cursor:not-allowed}.btnrow{display:flex;gap:9px;flex-wrap:wrap}.btnrow .btn{flex:1}button.secondary-link{border:0;background:none;color:var(--navy2);font-weight:750;text-decoration:underline;padding:6px}.settings-panel h2{font-size:18px;margin:0 0 7px;color:var(--navy)}.settings-panel p{font-size:13px;line-height:1.65;margin:4px 0 14px;color:var(--muted)}.inclusion{display:flex;align-items:center;gap:11px;padding:11px 1px;border-bottom:1px solid var(--line);font-size:14px}.inclusion:last-child{border-bottom:0}.inclusion input{width:22px;height:22px;accent-color:var(--navy);flex-shrink:0}.inclusion label{flex:1;cursor:pointer}.inline-qty{color:var(--muted);font-size:12px}.minihead{color:var(--navy);font-size:14px;font-weight:800;margin:19px 0 4px}.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}.field label{font-size:12px;font-weight:750;color:var(--navy)}.field input,.field select{border:1px solid #bac8d6;border-radius:10px;padding:12px 13px;min-width:0;width:100%;background:white;color:var(--ink)}.fieldgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.manage-item{display:flex;align-items:center;gap:7px;padding:10px 1px;border-bottom:1px solid var(--line)}.manage-item:last-child{border-bottom:0}.manage-item .name{flex:1;min-width:0;word-break:break-word;font-weight:700;font-size:13px}.manage-item .mini{color:var(--muted);font-weight:400;font-size:11px}.smallbtn{border:1px solid var(--line);background:white;color:var(--navy);padding:6px 9px;border-radius:8px;font-size:12px;font-weight:750;white-space:nowrap}.smallbtn.remove{color:#b73c3c}.footnote{text-align:center;color:#758091;font-size:11px;line-height:1.7;margin:24px auto 3px}.sr-only{position:absolute;clip:rect(0,0,0,0);white-space:nowrap;width:1px;height:1px;overflow:hidden}
    .reset-area{display:flex;justify-content:center;padding:3px 0 18px}.reset-area .btn{font-size:12px;min-height:39px;padding:8px 15px}
    .admin-entry{margin-top:22px;border-top:1px solid var(--line);padding:19px 0 2px;text-align:center}.admin-caption{color:var(--muted);font-size:11px;margin-bottom:7px}.admin-button{border:1px solid var(--line);background:transparent;color:var(--muted);font-size:12px;border-radius:10px;padding:11px 17px;font-weight:700}
    .back-row{margin:4px 0 16px}.back-row .btn{font-size:13px}
    @media(max-width:390px){.mode-tab{font-size:12px}.hero h1{font-size:23px}.season-row{align-items:flex-start}.gear-qty{font-size:11px}.fieldgrid{grid-template-columns:1fr}}
  </style>
</head>
<body><div id="app"></div><script>
(function(){
  'use strict';
  const STORAGE_KEY='hamana-yankees-gear-check-v1';
  const MODES=[{id:'practice',name:'練習試合'},{id:'official',name:'公式戦'},{id:'river',name:'河川敷練習'}];
  const summerRiver=['ballbasket','tballbasket','foldbasket','helmet','bluesheet','knockbat','bso','bases','homebase','linecar','catcher','measure','tent','toolbox','teabag','bench','coachchair','tballstand'];
  const ITEMS=[
    {id:'ballbasket',name:'ボールかご',store:1,qty:''},
    {id:'tballbasket',name:'置きT用ボールかご',store:1,qty:''},
    {id:'foldbasket',name:'折り畳みボールかご',store:1,qty:''},
    {id:'helmet',name:'ヘルメット',store:1,qty:''},
    {id:'bluesheet',name:'ブルーシート',store:1,qty:''},
    {id:'knockbat',name:'ノックバット',store:1,qty:''},
    {id:'bso',name:'BSO',store:1,qty:''},
    {id:'smallcones',name:'小さいマーカーコーン',store:1,qty:''},
    {id:'bases',name:'1・2・3塁ベース',store:1,qty:'1組'},
    {id:'homebase',name:'ホームベース',store:1,qty:'2つ'},
    {id:'linecar',name:'ラインカー',store:1,qty:''},
    {id:'catcher',name:'キャッチャー道具',store:1,qty:'2つ'},
    {id:'umpire',name:'審判道具',store:1,qty:''},
    {id:'measure',name:'メジャー（大）',store:1,qty:''},
    {id:'tent',name:'テント',store:1,qty:'',summerQty:'3つ',winterQty:'2つ'},
    {id:'toolbox',name:'工具箱',store:2,qty:''},
    {id:'teabag',name:'お茶バック',store:2,qty:''},
    {id:'bench',name:'長椅子',store:2,qty:''},
    {id:'coachchair',name:'監督・コーチの椅子',store:2,qty:'2つ'},
    {id:'scoretable',name:'スコアラー机',store:2,qty:''},
    {id:'scorechair',name:'スコアラー椅子',store:2,qty:''},
    {id:'shovel',name:'スコップ',store:2,qty:''},
    {id:'tballstand',name:'Tボール置き',store:2,qty:''}
  ];
  function initialState(){return {items:ITEMS,profiles:{'river-summer':summerRiver.slice(),'river-winter':summerRiver.slice(),'practice-summer':[],'practice-winter':[],'official-summer':[],'official-winter':[]},seasonPreference:'auto',mode:'river',checks:{}}}
  let persistent=true;
  function readState(){try{const saved=localStorage.getItem(STORAGE_KEY);if(!saved)return initialState();const data=JSON.parse(saved);if(!data || !Array.isArray(data.items)||!data.profiles||!data.checks)return initialState();const s=initialState();return {...s,...data,mode:MODES.some(m=>m.id===data.mode)?data.mode:'river'}}catch(e){persistent=false;return initialState()}}
  let state=readState();let view='check',editId=null;
  function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(e){persistent=false}}
  function japanDateParts(){const parts=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const p={};parts.forEach(x=>{p[x.type]=x.value});return {year:p.year,month:Number(p.month),day:p.day}}
  function dayKey(){const p=japanDateParts();return p.year+'-'+String(p.month).padStart(2,'0')+'-'+p.day}
  function season(){if(state.seasonPreference==='summer'||state.seasonPreference==='winter')return state.seasonPreference;const m=japanDateParts().month;return m>=4&&m<=10?'summer':'winter'}
  function key(){return state.mode+'-'+season()}
  function checkKey(){return dayKey()+'|'+key()}
  function selectedItems(){const selected=state.profiles[key()]||[];return state.items.filter(i=>selected.includes(i.id))}
  function checkedIds(){return state.checks[checkKey()]||[]}
  function qty(i){return season()==='summer'&&i.summerQty?i.summerQty:season()==='winter'&&i.winterQty?i.winterQty:(i.qty||'')}
  function escapeHTML(s){return String(s===undefined||s===null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  const h=escapeHTML;
  function modeTabs(){return '<div class="box"><div class="section-title">活動を選ぶ</div><div class="mode-tabs">'+MODES.map(m=>'<button type="button" class="mode-tab '+(state.mode===m.id?'active':'')+'" data-action="mode" data-id="'+m.id+'" aria-pressed="'+(state.mode===m.id)+'">'+m.name+'</button>').join('')+'</div></div>'}
  function seasonTabs(){const p=japanDateParts();const label=season()==='summer'?'夏仕様':'冬仕様';const prefs=[['auto','自動'],['summer','夏'],['winter','冬']];return '<div class="box"><div class="season-row"><div><div class="section-title" style="margin-bottom:6px">季節設定</div><span class="pill">'+label+'</span> <span class="small muted">'+p.month+'月・'+(state.seasonPreference==='auto'?'自動判定':'手動指定')+'</span></div><div class="season-set">'+prefs.map(x=>'<button class="seg '+(state.seasonPreference===x[0]?'active':'')+'" data-action="season" data-id="'+x[0]+'" aria-pressed="'+(state.seasonPreference===x[0])+'">'+x[1]+'</button>').join('')+'</div></div><div class="subnote">4〜10月は夏仕様、11〜3月は冬仕様。いつでも手動で変更できます。</div></div>'}
  function progress(){const all=selectedItems();const chosen=checkedIds();const done=all.filter(i=>chosen.includes(i.id)).length;return {total:all.length,done,percent:all.length?Math.round(100*done/all.length):0}}
  function storeBlock(n){const all=selectedItems().filter(i=>i.store===n), chosen=checkedIds(),done=all.filter(i=>chosen.includes(i.id)).length;return '<section class="box"><div class="store-head"><h2>器具庫'+n+'</h2><span class="count">'+done+' / '+all.length+' 完了</span></div>'+(all.length?'<div class="gear-list">'+all.map(i=>'<label class="gear-item '+(chosen.includes(i.id)?'checked':'')+'"><input class="gear-check" type="checkbox" data-action="check" data-id="'+h(i.id)+'" '+(chosen.includes(i.id)?'checked':'')+'><span class="gear-name">'+h(i.name)+'</span>'+(qty(i)?'<span class="gear-qty">'+h(qty(i))+'</span>':'')+'</label>').join('')+'</div>':'<div class="empty">この器具庫の持ち物は未設定です。<br>「リスト設定」から登録できます。</div>')+'</section>'}
  function checklistPage(){const p=progress();let message='';if(key()==='river-winter')message='<div class="info warning"><strong>冬の河川敷練習は仮設定です。</strong><br>夏と同じ持ち物を初期表示し、テントは2つにしています。冬の正しい持ち物が決まったら管理者用の「リスト設定」で変更してください。</div>';if(!p.total)message='<div class="info warning">この活動・季節の持ち物はまだ未登録です。管理者用の「リスト設定」から登録できます。</div>';
    return message+storeBlock(1)+storeBlock(2)+(p.total&&p.done===p.total?'<div class="positive">✓ 必要な道具はすべてチェックできました！</div>':'')+'<div class="reset-area"><button class="btn light" data-action="reset" '+(!p.done?'disabled':'')+'>チェックをリセット</button></div>'}
  function inclusionBlock(store){const ids=state.profiles[key()]||[];return '<div class="minihead">器具庫'+store+'</div><div>'+state.items.filter(i=>i.store===store).map(i=>'<div class="inclusion"><input type="checkbox" id="include-'+h(i.id)+'" data-action="include" data-id="'+h(i.id)+'" '+(ids.includes(i.id)?'checked':'')+'><label for="include-'+h(i.id)+'">'+h(i.name)+'</label>'+(qty(i)?'<span class="inline-qty">'+h(qty(i))+'</span>':'')+'</div>').join('')+'</div>'}
  function editForm(i){return '<form data-form="edit" data-id="'+h(i.id)+'" class="box" style="background:#f8fafc;margin:8px 0"><div class="section-title">道具を編集</div><div class="field"><label for="editname">道具名</label><input id="editname" name="name" maxlength="80" value="'+h(i.name)+'" required></div><div class="fieldgrid"><div class="field"><label for="editstore">器具庫</label><select id="editstore" name="store"><option value="1" '+(i.store===1?'selected':'')+'>器具庫1</option><option value="2" '+(i.store===2?'selected':'')+'>器具庫2</option></select></div><div class="field"><label for="editqty">通常の数量</label><input id="editqty" name="qty" value="'+h(i.qty||'')+'" maxlength="30" placeholder="例：2つ"></div></div><div class="fieldgrid"><div class="field"><label for="editsummer">夏の数量（任意）</label><input id="editsummer" name="summerQty" value="'+h(i.summerQty||'')+'" maxlength="30" placeholder="例：3つ"></div><div class="field"><label for="editwinter">冬の数量（任意）</label><input id="editwinter" name="winterQty" value="'+h(i.winterQty||'')+'" maxlength="30" placeholder="例：2つ"></div></div><div class="btnrow"><button class="btn primary" type="submit">保存する</button><button class="btn light" type="button" data-action="cancelEdit">キャンセル</button></div></form>'}
  function manageBlock(store){return '<div class="minihead">器具庫'+store+'</div>'+state.items.filter(i=>i.store===store).map(i=>'<div class="manage-item"><span class="name">'+h(i.name)+' <span class="mini">'+h(i.summerQty||i.winterQty?'夏：'+(i.summerQty||i.qty||'—')+' ／ 冬：'+(i.winterQty||i.qty||'—'):(i.qty||''))+'</span></span><button class="smallbtn" data-action="edit" data-id="'+h(i.id)+'">編集</button><button class="smallbtn remove" data-action="remove" data-id="'+h(i.id)+'">削除</button></div>'+(editId===i.id?editForm(i):'')).join('')}
  function settingsPage(){const modeName=MODES.find(m=>m.id===state.mode).name;return '<div class="info"><strong>'+modeName+'・'+(season()==='summer'?'夏':'冬')+'仕様</strong>のリストを編集中です。ここでチェックした道具だけが持ち出し画面に表示されます。</div><section class="box settings-panel"><h2>① 持ち物リストの設定</h2><p>活動・季節ごとに必要な道具を登録できます。変更内容はこの端末に保存されます。</p>'+inclusionBlock(1)+inclusionBlock(2)+'</section><section class="box settings-panel"><h2>② 新しい道具を追加</h2><p>器具庫に新しい道具が増えたら、いつでも追加できます。</p><form data-form="add"><div class="field"><label for="newname">道具名 <span aria-hidden="true">*</span></label><input id="newname" name="name" maxlength="80" placeholder="例：バットスタンド" required></div><div class="fieldgrid"><div class="field"><label for="newstore">保管場所</label><select id="newstore" name="store"><option value="1">器具庫1</option><option value="2">器具庫2</option></select></div><div class="field"><label for="newqty">数量（任意）</label><input id="newqty" name="qty" maxlength="30" placeholder="例：2つ"></div></div><label class="inclusion" style="border:0;padding:0 0 14px"><input type="checkbox" name="addCurrent" checked><span>今選んでいる活動・季節のリストにも追加</span></label><button type="submit" class="btn primary" style="width:100%">＋ 道具を登録</button></form></section><section class="box settings-panel"><h2>③ 登録済み道具を管理</h2><p>道具名・数量・器具庫を後から修正できます。削除するとすべての活動のリストから外れます。</p>'+manageBlock(1)+manageBlock(2)+'</section><div class="btnrow"><button class="btn primary" data-action="goCheck">✓ チェック画面に戻る</button></div>'}
  function render(){const modeName=MODES.find(m=>m.id===state.mode).name;document.getElementById('app').innerHTML='<div class="shell"><header class="hero"><div class="eyebrow">HAMANA YANKEES</div><h1>⚾ 道具チェック</h1><p>器具庫からの忘れ物を防ごう</p></header>'+(view==='settings'?'<div class="back-row"><button class="btn light" data-action="goCheck">← チェック画面へ戻る</button></div>':'')+modeTabs()+seasonTabs()+(view==='check'?checklistPage():settingsPage())+(view==='check'?'<div class="admin-entry"><div class="admin-caption">管理者向け</div><button class="admin-button" data-action="settings">⚙ リスト設定・道具の追加</button></div>':'')+'<footer class="footnote">浜名ヤンキース｜'+h(modeName)+'<br>チェック・設定は、この端末のブラウザ内に保存されます。<br>別の端末とは自動同期されません。'+(!persistent?'<br>※現在のブラウザでは保存できない可能性があります。':'')+'</footer></div>'}
  document.getElementById('app').addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;if(a==='mode'){state.mode=id;editId=null;save();render()}else if(a==='season'){state.seasonPreference=id;editId=null;save();render()}else if(a==='settings'){view='settings';editId=null;render()}else if(a==='goCheck'){view='check';editId=null;render()}else if(a==='reset'){if(confirm('現在の活動・季節の、本日のチェックをすべて外しますか？')){state.checks[checkKey()]=[];save();render()}}else if(a==='edit'){editId=id;render()}else if(a==='cancelEdit'){editId=null;render()}else if(a==='remove'){const item=state.items.find(x=>x.id===id);if(item&&confirm('「'+item.name+'」を道具一覧から削除しますか？（すべての活動から外れます）')){state.items=state.items.filter(x=>x.id!==id);Object.keys(state.profiles).forEach(k=>state.profiles[k]=state.profiles[k].filter(x=>x!==id));editId=null;save();render()}}});
  document.getElementById('app').addEventListener('change',e=>{const el=e.target;if(el.dataset.action==='check'){const k=checkKey(),prev=state.checks[k]||[];state.checks[k]=el.checked?[...new Set([...prev,el.dataset.id])]:prev.filter(x=>x!==el.dataset.id);save();render()}else if(el.dataset.action==='include'){const k=key(),prev=state.profiles[k]||[];state.profiles[k]=el.checked?[...new Set([...prev,el.dataset.id])]:prev.filter(x=>x!==el.dataset.id);save();render()}});
  document.getElementById('app').addEventListener('submit',e=>{const form=e.target;if(!form.dataset.form)return;e.preventDefault();const f=new FormData(form);if(form.dataset.form==='add'){const name=String(f.get('name')||'').trim(),qty=String(f.get('qty')||'').trim(),store=Number(f.get('store'));if(!name)return;const id='custom_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7);state.items.push({id,name,store,qty});if(f.has('addCurrent')){const k=key();state.profiles[k]=[...(state.profiles[k]||[]),id]}save();render();document.getElementById('newname')?.focus()}else if(form.dataset.form==='edit'){const item=state.items.find(i=>i.id===form.dataset.id);if(!item)return;const name=String(f.get('name')||'').trim();if(!name)return;item.name=name;item.store=Number(f.get('store'));item.qty=String(f.get('qty')||'').trim();item.summerQty=String(f.get('summerQty')||'').trim();item.winterQty=String(f.get('winterQty')||'').trim();editId=null;save();render()}});
  render();
})();
</script></body></html>
