name: Mini basket security tests
on:
  push:
    branches: [development/mini-basket-release-preparation]
  pull_request:
    paths: ['mini-basket-production/**', '.github/workflows/mini-basket-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mini-basket-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --ignore-scripts
      - run: node parent-accountless-tests.mjs && node parent-input-tests.mjs && node weekday-conditions-tests.mjs && node auto-draft-tests.mjs && node month-rollover-tests.mjs && node month-approval-tests.mjs && node duty-ledger-tests.mjs && node swap-confirmation-tests.mjs && node swap-ui-tests.mjs
      - run: node --check firebase-functions/index.mjs
      - run: npm run test:rules
      - run: npm audit --json > audit-results.json
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mini-basket-test-evidence
          path: |
            mini-basket-production/*debug.log
            mini-basket-production/audit-results.json
