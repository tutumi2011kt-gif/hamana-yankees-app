<body>
<div class="wrap">
  <header class="hero"><div class="hero-top"><span class="eyebrow">⛄ MINI BASKETBALL · WINTER</span><span class="tag">📱 公開体験版</span></div><h1>🏀 ミニバス当番管理</h1><p>2026年12月・2027年1月｜みんなで協力できる当番表</p><p style="margin-top:10px;padding:8px 10px;background:#fff9ec;border:1px solid #f2e1b7;border-radius:10px;font-weight:700">⚠️ 体験版：名前は登録メンバー名、当番日・試合日・希望はすべて説明用です。入力はこの端末内だけに保存され、ほかの人には共有されません。</p></header>
  <nav class="tabs" aria-label="画面切替">
    <button class="tab on" data-view="parent">📱 保護者の入力</button>
    <button class="tab" data-view="shared">👀 みんなの希望</button>
    <button class="tab" data-view="both">🗓️ 2か月一覧</button>
    
  </nav>
  <main id="app"></main>
  <footer class="footer">※名前は登録メンバー名ですが、仮当番表・希望登録は説明用の架空データです。実際の練習試合、担当日、保護者の回答を示すものではありません。データはこのブラウザ内だけで保持され、Gmail送信・LINE投稿・サーバー保存は行いません。本番の管理者画面は別途認証とデータアクセス制限を必須にします。</footer>
</div>
<div id="toast" class="toast" aria-live="polite"></div>
<script>
'use strict';
const MEMBERS=['あん','大竹わかな','かほ','こはる','さやか','なぎさ','のどか','はるか','まい','みあ','村松さわ','ゆい'];
const SHORT={'村松さわ':'さわ','大竹わかな':'わかな'};
const BASE={
 '2026-12':{2:'ゆい',4:'みあ',5:'あん',9:'まい',11:'のどか',12:'なぎさ',13:'さやか',16:'ゆい',18:'こはる',19:'大竹わかな',23:'かほ',26:'はるか',27:'みあ',30:'ゆい'},
 '2027-01':{2:'あん',3:'まい',6:'ゆい',8:'みあ',9:'なぎさ',13:'さやか',15:'こはる',16:'村松さわ',17:'大竹わかな',20:'かほ',22:'はるか',23:'みあ',27:'ゆい',29:'あん',30:'のどか',31:'まい'}
};
const EXCEPTIONS={'2026-12':{6:'試合',20:'試合',25:'休み'},'2027-01':{1:'休み',10:'試合',24:'休み'}};
const MONTHS=['2026-12','2027-01'];
const KEY='mini_basket_public_demo_20261109_v2_realnames';
const initial=()=>({month:'2027-01',person:'みあ',mode:'bad',view:'parent',focus:8,calendarMode:'month',
 entries:[{m:'2026-12',d:4,p:'みあ',t:'bad'},{m:'2026-12',d:4,p:'かほ',t:'good'},{m:'2027-01',d:8,p:'みあ',t:'bad'}],
 activities:{},confirmed:{},logs:[],practiceDone:{}});
let state=initial();try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&MONTHS.includes(s.month)&&MEMBERS.includes(s.person)){state={...initial(),...s};if(state.view==='admin')state.view='parent';}}catch(_e){}
let currentChoice='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const year=m=>Number(m.slice(0,4)),monthNum=m=>Number(m.slice(5));
const title=m=>`${year(m)}年${monthNum(m)}月`;
const dayOfWeek=(m,d)=>new Date(year(m),monthNum(m)-1,d).getDay();
const weekNames=['日','月','火','水','木','金','土'];
const daysIn=m=>new Date(year(m),monthNum(m),0).getDate();
const abbrev=n=>SHORT[n]||n;
function kind(m,d){const override=state.activities[`${m}-${d}`];if(override)return override; if(EXCEPTIONS[m]?.[d])return EXCEPTIONS[m][d];return [0,3,5,6].includes(dayOfWeek(m,d))?'練習':'なし';}
const baseOwner=(m,d)=>BASE[m]?.[d]||null;
function owner(m,d){return kind(m,d)==='練習'?(state.confirmed[`${m}-${d}`]||baseOwner(m,d)):null;}
function entries(m,d,t){return state.entries.filter(e=>e.m===m&&e.d===d&&(!t||e.t===t));}
const has=(m,d,p,t)=>state.entries.some(e=>e.m===m&&e.d===d&&e.p===p&&e.t===t);
function canSelect(m,d,p,t){if(kind(m,d)!=='練習'||!owner(m,d))return false;if(p==='村松さわ'&&m==='2026-12')return false;return t==='bad'?owner(m,d)===p:owner(m,d)!==p;}
function urgency(m,d){if(kind(m,d)!=='練習'||!owner(m,d))return 'none';const needs=entries(m,d,'bad').some(e=>e.p===owner(m,d));if(!needs)return 'none';return entries(m,d,'good').some(e=>e.p!==owner(m,d))?'candidate':'urgent';}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(_e){}}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.className='toast show';clearTimeout(window.demoToast);window.demoToast=setTimeout(()=>el.className='toast',2800);}
function log(type,msg){state.logs.unshift({t:new Date().toLocaleString('ja-JP'),type,msg});state.logs=state.logs.slice(0,60);}
function switchView(view){state.view=view==='admin'?'parent':view;persist();render();}
function switchMonth(m){state.month=m;state.focus=m==='2027-01'?8:4;persist();render();}
function switchPerson(p){state.person=p;persist();render();}
function toggleEntry(m,d){if(!canSelect(m,d,state.person,state.mode)){toast('この日付は選択できません');return;}const i=state.entries.findIndex(e=>e.m===m&&e.d===d&&e.p===state.person&&e.t===state.mode);const mark=state.mode==='bad'?'×':'○';if(i>=0){state.entries.splice(i,1);log('削除',`${title(m)}${d}日 ${state.person}${mark}を取消`);}else{state.entries.push({m,d,p:state.person,t:state.mode});log('登録',`${title(m)}${d}日 ${state.person}${mark}を登録`);}state.focus=d;persist();render();toast(`カレンダーに ${state.person}${mark} を反映しました（デモ）`);}
function buttons(){return `<div class="mode-row"><button class="mode ${state.mode==='bad'?'red':''}" data-action="mode" data-mode="bad"><b class="redtext">❌ 当番ができない日</b><span>自分の当番日だけ × をつける</span></button><button class="mode ${state.mode==='good'?'green':''}" data-action="mode" data-mode="good"><b class="greentext">⭕ 代わりにできる日</b><span>ほかの人の当番を助ける</span></button></div><div class="hint ${state.mode==='bad'?'redhint':'greenhint'}">${state.mode==='bad'?'❌ 赤枠の「自分が当番の日」をタップしてください。ほかの人の日には×を付けられません。':'⭕ 緑枠の「ほかの人が当番の日」をタップしてください。ゆいさんも金・土・日曜日に○を付けられます。'}</div>`;}
function calendar(m,interactive=true){const first=dayOfWeek(m,1),n=daysIn(m),nCells=Math.ceil((first+n)/7)*7;let content='';for(let i=0;i<nCells;i++){const d=i-first+1;if(d<1||d>n){content+='<div class="day empty"></div>';continue;}const k=kind(m,d),o=owner(m,d),base=baseOwner(m,d),bad=entries(m,d,'bad'),good=entries(m,d,'good'),ur=urgency(m,d),selectable=interactive&&state.view==='parent'&&canSelect(m,d,state.person,state.mode),changed=o&&base!==o;const cellClass=['day',dayOfWeek(m,d)===0?'sun':'',dayOfWeek(m,d)===6?'sat':'',k!=='練習'?'off':'',ur==='urgent'?'urgent':ur==='candidate'?'covered':'',selectable?'tappable':'',selectable&&state.mode==='good'?'greenmode':'',state.focus===d&&m===state.month?'selected':''].join(' ');let body=`<span class="date">${d}</span>`;if(k==='試合'||k==='休み')body+=`<span class="smalltag ${k==='休み'?'rest':''}">${k}</span>`;else if(k==='練習'){body+=`<span class="owner">${esc(abbrev(o||'未割当'))}</span>`;if(changed)body+=`<span class="mini status">元:${esc(abbrev(base))}</span>`;for(const e of bad.slice(0,1))body+=`<span class="mini bad">${esc(abbrev(e.p))} ×</span>`;if(bad.length>1)body+=`<span class="mini bad">他${bad.length-1}件×</span>`;for(const e of good.slice(0,1))body+=`<span class="mini good">${esc(abbrev(e.p))} ○</span>`;if(good.length>1)body+=`<span class="mini good">他${good.length-1}件○</span>`;if(ur==='urgent')body+='<span class="mini alert">🙏募集中</span>';if(ur==='candidate')body+='<span class="mini good">○候補</span>';}const clickable=interactive&&(state.view==='admin'||state.view==='both'||state.view==='shared'||selectable);content+=`<button class="${cellClass}" ${clickable?`data-action="day" data-month="${m}" data-day="${d}"`:'disabled'} aria-label="${title(m)}${d}日 ${esc(o||k)}" title="${esc(o||k)}">${body}</button>`;}return `<div class="weekday">${weekNames.map(w=>`<div>${w}</div>`).join('')}</div><div class="cal">${content}</div>`;}

function largeDateList(m){
 let cards='';
 for(let d=1;d<=daysIn(m);d++){
  const k=kind(m,d);if(k==='なし')continue;
  const o=owner(m,d),bad=entries(m,d,'bad'),good=entries(m,d,'good'),ur=urgency(m,d);
  const selectable=state.view==='parent'&&canSelect(m,d,state.person,state.mode);
  const cls=['date-card',ur==='urgent'?'urgent':'',ur==='candidate'?'covered':'',selectable?'tappable':'',selectable&&state.mode==='good'?'greenmode':''].join(' ');
  const extra=k==='練習'
    ? `<span class="list-owner">仮当番：${esc(o||'未割当')}</span>${bad.map(e=>`<span class="list-bad">${esc(e.p)} × 当番不可</span>`).join('')}${good.map(e=>`<span class="list-good">${esc(e.p)} ○ 変更可能</span>`).join('')}${ur==='urgent'?'<span class="list-urgent">🙏 交代できる方を募集中</span>':ur==='candidate'?'<span class="list-good">交代候補あり（未確定）</span>':''}`
    :`<span class="list-meta">${esc(k)}・当番なし</span>`;
  cards+=`<button class="${cls}" ${selectable?`data-action="day" data-month="${m}" data-day="${d}"`:'disabled'}><span class="list-date">${d}日<small style="display:block;font-size:12px;color:var(--sub)">（${weekNames[dayOfWeek(m,d)]}）</small></span><span class="list-content">${extra}<span class="list-meta">${selectable?'ここをタップして'+(state.mode==='bad'?' × を登録':' ○ を登録'):' '}</span></span></button>`;
 }
 return '<div class="date-cards">'+cards+'</div>';
}
function urgentDates(months){return months.flatMap(m=>Object.keys(BASE[m]).map(Number).filter(d=>urgency(m,d)==='urgent').map(d=>({m,d,p:owner(m,d)})));}
function reviewDay(m,d){const k=kind(m,d),o=owner(m,d),b=baseOwner(m,d),bad=entries(m,d,'bad'),good=entries(m,d,'good');return `<div class="detail"><div class="section-head"><span class="detailhead">📅 ${title(m)}${d}日（${weekNames[dayOfWeek(m,d)]}）</span><span class="tag">${esc(k)}</span></div><p class="tip">仮担当：<strong>${esc(b||'なし')}</strong>${o&&b!==o?` ／ 承認後：<strong>${esc(o)}</strong>`:''}</p><div class="rows">${bad.length?bad.map(e=>`<span class="chip bad">${esc(e.p)} × できない</span>`).join(''):'<span class="chip plain">× なし</span>'}${good.length?good.map(e=>`<span class="chip good">${esc(e.p)} ○ 交代可能</span>`).join(''):'<span class="chip plain">○ なし</span>'}</div>${urgency(m,d)==='urgent'?'<p class="redtext"><b>🙏 交代できる方を募集中！</b>　○が付くまで、ほかの人に勝手に割り当てません。</p>':urgency(m,d)==='candidate'?'<p class="greentext"><b>交代候補あり（まだ未確定）</b></p>':''}</div>`;}
function summaryChoices(m,p){const b=state.entries.filter(e=>e.m===m&&e.p===p&&e.t==='bad').map(e=>e.d).sort((a,b)=>a-b),g=state.entries.filter(e=>e.m===m&&e.p===p&&e.t==='good').map(e=>e.d).sort((a,b)=>a-b);return `<div class="panel"><h3>📝 ${esc(p)}さんの選択内容</h3><p><span class="chip bad">× できない</span> <b>${b.length?b.map(d=>d+'日').join('・'):'なし'}</b></p><p><span class="chip good">○ 代われる</span> <b>${g.length?g.map(d=>d+'日').join('・'):'なし'}</b></p><div class="actions"><button class="btn primary" data-action="demo-submit">📩 入力内容を確認（デモ）</button><button class="btn" data-action="shared">👀 みんなの希望を見る</button></div><p class="tip">※このデモは日付タップで画面内に即反映。本番では確認・登録後に保存し、管理者のGmailへ控えを送ります。</p></div>`;}
function parent(){const m=state.month,urg=urgentDates([m]);return `<section class="panel"><div class="section-head"><h2>📱 保護者用：自分の希望を入力</h2><span class="tag">共通URL＋名前選択</span></div><div class="controls"><div><label class="form-label">① お子さんの名前</label><select class="select" data-change="person">${MEMBERS.map(p=>`<option value="${esc(p)}" ${state.person===p?'selected':''}>${esc(p)}</option>`).join('')}</select></div><div><label class="form-label">② 入力する月</label><select class="select" data-change="month">${MONTHS.map(m=>`<option value="${m}" ${state.month===m?'selected':''}>${title(m)}</option>`).join('')}</select></div></div><div class="months">${MONTHS.map(m=>`<button class="month-tab ${state.month===m?'on':''}" data-action="month" data-month="${m}">${title(m)}</button>`).join('')}</div><p class="tip">この月の <strong>仮当番表</strong> を見ながら、できない日は×、代われる日は○を入力します。</p>${buttons()}</section><section class="panel"><div class="section-head"><h2>🗓️ ${title(m)} 仮当番カレンダー</h2><span class="tag">冬の予定 ❄️</span></div><div class="calendar-view-toggle" role="group" aria-label="カレンダー表示切替"><button class="btn ${state.calendarMode==='month'?'primary':''}" data-action="calendar-mode" data-calmode="month">🗓 月カレンダー</button><button class="btn ${state.calendarMode==='list'?'primary':''}" data-action="calendar-mode" data-calmode="list">🔎 日付を大きく見る</button></div><p class="tip">スマホで文字が小さい場合は「日付を大きく見る」を選べます。どちらも日付をタップして×・○を付けられます。</p>${state.calendarMode==='list'?largeDateList(m):calendar(m)}<div class="legend"><span><i style="background:#fae5e9"></i>交代募集中</span><span><i style="background:#e1f6eb"></i>交代候補あり</span><span>試合・休み＝当番なし</span></div>${reviewDay(m,state.focus>=1&&state.focus<=daysIn(m)?state.focus:1)}${urg.length?`<div class="alertbox"><strong>🙏 交代できる方を募集中：${urg.length}日</strong><p>${urg.map(x=>`${x.d}日（${esc(x.p)}）`).join('、')}</p><p class="tip">○の候補がいない日は、絶対に別の人を自動割り当てしません。</p></div>`:'<div class="okbox">✅ 現在、交代候補ゼロの「×」日はありません。</div>'}</section>${summaryChoices(m,state.person)}`;}
function shared(){const m=state.month,members=MEMBERS.filter(p=>!(m==='2026-12'&&p==='村松さわ')),respondents=new Set(state.entries.filter(e=>e.m===m).map(e=>e.p)),alerts=urgentDates([m]);return `<section class="panel"><div class="section-head"><h2>👀 全員が見られる希望一覧</h2><span class="tag">累計当番回数は非表示</span></div><div class="months">${MONTHS.map(k=>`<button class="month-tab ${k===m?'on':''}" data-action="month" data-month="${k}">${title(k)}</button>`).join('')}</div><div class="summary-row"><div class="summary-card"><span class="tip">○／×が入力された人数</span><div class="big">${respondents.size} <small style="font-size:13px">/ ${members.length} 人</small></div></div><div class="summary-card"><span class="tip">交代候補なしの日</span><div class="big redtext">${alerts.length} <small style="font-size:13px">日</small></div></div></div><p class="tip">未入力は「当番可能」という意味ではありません。デモの登録内容は仮の例です。</p><div class="table-wrap"><table class="table"><thead><tr><th>名前</th><th>× できない</th><th>○ 代われる</th></tr></thead><tbody>${MEMBERS.map(p=>{if(m==='2026-12'&&p==='村松さわ')return `<tr><td>${esc(p)}</td><td colspan="2" class="muted">1月から当番開始</td></tr>`;const x=state.entries.filter(e=>e.m===m&&e.p===p&&e.t==='bad').map(e=>e.d).sort((a,b)=>a-b),o=state.entries.filter(e=>e.m===m&&e.p===p&&e.t==='good').map(e=>e.d).sort((a,b)=>a-b);return `<tr><td><b>${esc(p)}</b></td><td class="redtext">${x.length?x.join('日・')+'日':'—'}</td><td class="greentext">${o.length?o.join('日・')+'日':'—'}</td></tr>`;}).join('')}</tbody></table></div><div class="actions"><button class="btn primary" data-action="copy">📋 LINE共有用文章をコピー</button><button class="btn" data-action="parent">入力画面に戻る</button></div></section><section class="panel"><h3>🗓️ カレンダーで確認</h3>${calendar(m,false)}<p class="tip">仮担当名を残したまま、×・○が表示されます。</p></section>`;}
function both(){return `<section class="panel"><div class="section-head"><h2>🗓️ 12月・1月の仮当番表</h2><span class="tag">2か月まとめて確認</span></div><p class="tip">水・金・土・日は原則練習。試合・休みはサンプルとして設定しています。</p><div class="two-months">${MONTHS.map(m=>`<div><h3>${title(m)}</h3>${calendar(m,false)}<div class="actions"><button class="btn" data-action="open-month" data-month="${m}">この月を入力する</button></div></div>`).join('')}</div></section>`;}
function counts(){const total={};for(const p of MEMBERS)total[p]={planned:0,cancelled:0,done:state.practiceDone[p]||0};for(const m of MONTHS)for(const [d0,p] of Object.entries(BASE[m])){const d=Number(d0),k=kind(m,d),on=owner(m,d);if(k==='練習'&&on)total[on].planned++;if(k!=='練習')total[p].cancelled++;}return total;}
function validate(){let serious=[],warnings=[];for(const m of MONTHS)for(const [d0,p] of Object.entries(BASE[m])){const d=Number(d0),o=owner(m,d),k=kind(m,d),confirmed=state.confirmed[`${m}-${d}`];if(m==='2026-12'&&p==='村松さわ')serious.push('12月に村松さわさんが仮担当');if(p==='ゆい'&&dayOfWeek(m,d)!==3)serious.push('ゆいさんの初期割当が水曜日以外');if(k==='練習'&&!o)serious.push(`${title(m)}${d}日が未割当`);if(k==='練習'&&confirmed&&confirmed!==p&&!has(m,d,confirmed,'good'))serious.push(`${title(m)}${d}日に○を付けていない人へ変更`);if(k==='練習'&&urgency(m,d)==='urgent')warnings.push(`${title(m)}${d}日：交代候補なし・要調整`);}return {serious,warnings};}
function admin(){const m=state.month,selected=Math.min(state.focus,daysIn(m)),duty=owner(m,selected),activity=kind(m,selected),candidates=entries(m,selected,'good').filter(e=>e.p!==duty),urg=urgentDates(MONTHS),c=counts(),v=validate();return `<section class="panel"><div class="section-head"><h2>🔒 管理者専用画面（デモ）</h2><span class="tag">本番は認証必須</span></div><p class="tip">ここにある累計・実績・修正機能は、保護者用画面には表示しません。</p><div class="admin-counts"><div><span class="tip">登録者</span><b>12人</b></div><div><span class="tip">要調整日</span><b class="redtext">${urg.length}日</b></div><div><span class="tip">ルール重大違反</span><b>${v.serious.length}件</b></div></div><div class="months">${MONTHS.map(k=>`<button class="month-tab ${k===m?'on':''}" data-action="month" data-month="${k}">${title(k)}</button>`).join('')}</div><h3>活動予定・交代候補の確認</h3>${calendar(m,true)}${reviewDay(m,selected)}<div class="divider"></div><h3>① 急な練習試合・休みへの変更</h3><div class="admin-edit"><label><span class="form-label">変更する日</span><select class="select" id="admin-date">${Object.keys(BASE[m]).map(Number).map(d=>`<option value="${d}" ${selected===d?'selected':''}>${d}日（${weekNames[dayOfWeek(m,d)]}）</option>`).join('')}</select></label><label><span class="form-label">活動内容</span><select class="select" id="admin-activity"><option value="練習" ${activity==='練習'?'selected':''}>練習（当番あり）</option><option value="試合" ${activity==='試合'?'selected':''}>練習試合（当番なし）</option><option value="休み" ${activity==='休み'?'selected':''}>休み（当番なし）</option></select></label></div><div class="actions"><button class="btn warn" data-action="update-activity">活動予定を変更（デモ）</button></div><p class="tip">試合・休みに変更しても元担当者の履歴は残し、実施済み回数へ加算しません。</p><div class="divider"></div><h3>② 交代を確定する（○を付けた人だけ）</h3><div class="admin-edit"><label><span class="form-label">交代候補者</span><select class="select" id="candidate">${candidates.length?candidates.map(x=>`<option value="${esc(x.p)}">${esc(x.p)}</option>`).join(''):'<option value="">○を登録した人がいません</option>'}</select></label><div class="actions"><button class="btn success" data-action="approve" ${candidates.length&&activity==='練習'?'':'disabled'}>候補を確認して交代確定</button></div></div><p class="tip"><strong>○が0人ならボタンを無効化。</strong>年間公平性のために別の人を勝手に割り当てることはありません。</p></section><section class="panel"><h3>📊 個人別の当番回数（管理者限定）</h3><div class="table-wrap"><table class="table"><thead><tr><th>名前</th><th>実施済</th><th>今後予定</th><th>中止</th><th>実施済の手動補正</th></tr></thead><tbody>${MEMBERS.map(p=>`<tr><td>${esc(p)}</td><td><b>${c[p].done}</b>回</td><td>${c[p].planned}回</td><td>${c[p].cancelled}回</td><td><button class="btn" data-action="count" data-person="${esc(p)}" data-delta="-1" ${c[p].done<=0?'disabled':''}>−</button> <button class="btn" data-action="count" data-person="${esc(p)}" data-delta="1">＋</button></td></tr>`).join('')}</tbody></table></div><p class="tip">2026年12月からの実施済回数は初期値0回です。＋／−はデモ操作で、履歴に残ります。本番では実施日と修正理由を記録します。</p></section><section class="panel"><h3>🛡️ 自動ファクトチェック</h3><div class="checklist"><div class="line"><span>仮当番は1日1人／ゆいは初期割当で水曜のみ</span><strong>${v.serious.length?'要確認':'✅ OK'}</strong></div><div class="line"><span>○のない人を勝手に交代へ割り当てない</span><strong>${v.serious.length?'要確認':'✅ OK'}</strong></div><div class="line"><span>交代候補ゼロの未解決日</span><strong class="redtext">${v.warnings.length}件</strong></div></div>${v.warnings.length?`<div class="alertbox"><strong>⚠️ 確定前に調整が必要です</strong><p class="tip">${v.warnings.map(esc).join('、')}</p></div>`:'<div class="okbox">✅ 現在、交代候補ゼロの未解決日はありません。</div>'}<div class="actions"><button class="btn primary" data-action="mail-preview">📧 Gmail照合用の記録を確認</button></div></section><section class="panel"><h3>🕓 変更履歴（デモ）</h3>${state.logs.length?`<div class="table-wrap"><table class="table"><thead><tr><th>操作日時</th><th>種類</th><th>変更内容</th></tr></thead><tbody>${state.logs.slice(0,16).map(l=>`<tr><td>${esc(l.t)}</td><td>${esc(l.type)}</td><td>${esc(l.msg)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="tip">まだ操作履歴がありません。日付を変更するとここに表示されます。</p>'}</section>`;}
function render(){if(state.view==='admin')state.view='parent';document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.view===state.view));document.getElementById('app').innerHTML=state.view==='parent'?parent():state.view==='shared'?shared():both();}
document.addEventListener('change',e=>{if(e.target.dataset.change==='person')switchPerson(e.target.value);if(e.target.dataset.change==='month')switchMonth(e.target.value);if(e.target.id==='admin-date'){state.focus=Number(e.target.value);persist();render();}});
document.addEventListener('click',e=>{const b=e.target.closest('button[data-view],button[data-action]');if(!b)return;if(b.dataset.view){switchView(b.dataset.view);return;}const a=b.dataset.action;if(a==='mode'){state.mode=b.dataset.mode;persist();render();return;}if(a==='calendar-mode'){state.calendarMode=b.dataset.calmode==='list'?'list':'month';persist();render();return;}if(a==='month'){switchMonth(b.dataset.month);return;}if(a==='open-month'){state.view='parent';switchMonth(b.dataset.month);return;}if(a==='parent'||a==='shared'){switchView(a);return;}if(a==='day'){const m=b.dataset.month,d=Number(b.dataset.day);if(state.view==='parent'){toggleEntry(m,d);}else{state.month=m;state.focus=d;persist();render();}return;}if(a==='demo-submit'){let b=state.entries.filter(x=>x.m===state.month&&x.p===state.person&&x.t==='bad'),g=state.entries.filter(x=>x.m===state.month&&x.p===state.person&&x.t==='good');alert(`【保護者の登録内容・確認デモ】\n名前：${state.person}\n${title(state.month)}\n× 当番ができない日：${b.map(x=>x.d+'日').join('、')||'なし'}\n○ 変更可能な日：${g.map(x=>x.d+'日').join('、')||'なし'}\n\n本番では確認後に保存し、管理者Gmailへ記録を送ります。\n※このデモでは実際の送信はしません。`);return;}if(a==='copy'){const m=state.month;const content=`【ミニバス当番希望一覧】${title(m)}\n`+MEMBERS.map(p=>{if(m==='2026-12'&&p==='村松さわ')return `${p}：12月は対象外`;const bb=state.entries.filter(e=>e.m===m&&e.p===p&&e.t==='bad').map(e=>e.d+'日').join('、')||'なし';const gg=state.entries.filter(e=>e.m===m&&e.p===p&&e.t==='good').map(e=>e.d+'日').join('、')||'なし';return `${p}：× ${bb} ／ ○ ${gg}`}).join('\n')+'\n※デモ用の架空の内容です';if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(content).then(()=>toast('LINE共有用の文章をコピーしました')).catch(()=>prompt('こちらをコピーしてください',content));}else prompt('こちらをコピーしてください',content);return;}if(a==='update-activity'){const d=state.focus,k=document.getElementById('admin-activity')?.value;if(!k)return;const old=kind(state.month,d);state.activities[`${state.month}-${d}`]=k;log('活動変更',`${title(state.month)}${d}日 ${old} → ${k}（元担当：${baseOwner(state.month,d)}）`);persist();render();toast('活動予定を変更しました。中止日の当番は自動で外れます。');return;}if(a==='approve'){const d=state.focus,m=state.month,p=document.getElementById('candidate')?.value,o=owner(m,d);if(!p||!has(m,d,p,'good')||urgency(m,d)==='urgent'){toast('○の交代候補が必要です。勝手な割り当ては禁止です');return;}if(!confirm(`${title(m)}${d}日：当番を ${o} → ${p} に変更しますか？\n本人の○登録あり・管理者の明示承認後に限り確定します。`))return;state.confirmed[`${m}-${d}`]=p;log('管理者承認',`${title(m)}${d}日 当番：${o} → ${p}`);persist();render();toast('本人の○登録と管理者承認に基づき交代を確定しました');return;}if(a==='count'){const p=b.dataset.person,n=Number(b.dataset.delta);const old=state.practiceDone[p]||0;state.practiceDone[p]=Math.max(0,old+n);log('管理者回数補正',`${p} 実施済 ${old} → ${state.practiceDone[p]}`);persist();render();return;}if(a==='mail-preview'){const rows=state.logs.slice(0,15).map(l=>`${l.t}｜${l.type}｜${l.msg}`);alert(`【Gmail照合用のデモ記録】\n${rows.length?rows.join('\n'):'まだ操作履歴なし'}\n\n※実際のGmail送信・受信照合は行っていません。`);return;}});
const resetBar=document.createElement('div');resetBar.className='actions';resetBar.innerHTML='<button class="btn" id="reset-demo">↺ 体験版を初期状態に戻す</button>';
document.querySelector('.wrap').insertBefore(resetBar,document.querySelector('.footer'));
document.getElementById('reset-demo').addEventListener('click',()=>{if(confirm('このブラウザ内の体験版データを初期化しますか？')){state=initial();persist();render();toast('初期データに戻しました');}});
render();
</script>
</body></html>
